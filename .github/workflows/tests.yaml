name: Testing
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua-version: ['5.1', '5.2', '5.3', '5.4']
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: leafo/gh-actions-luarocks@v5
      - name: Run tests
        run: luarocks test

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lua-language-server
        run: |
          LLS_VERSION=$(curl -s https://api.github.com/repos/LuaLS/lua-language-server/releases/latest | grep -Po '"tag_name": "\K[^"]+')
          curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C /usr/local
      - name: Run LuaLS check
        run: lua-language-server --check=. --check_format=pretty --checklevel=Warning

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - name: Install rocks
        run: |
          luarocks install luacov
          luarocks install luaunit 3.4
          luarocks install luacov-reporter-lcov
      - name: Run tests
        run: |
          lua -lluacov tests/run.lua
          luacov -c .luacov -v luacov.report.out -r lcov  
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./luacov.report.out
