name: Documentation
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  generate_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lua
      - uses: leafo/gh-actions-lua@v13
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install dkjson

      # LuaLS
      - name: Install lua-language-server
        env:
          LLS_VERSION: "3.19.2"
        run: |
          mkdir -p "$HOME/.local/lls"
          curl -sL "https://github.com/LuaLS/lua-language-server/releases/download/${LLS_VERSION}/lua-language-server-${LLS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C "$HOME/.local/lls"
          echo "$HOME/.local/lls/bin" >> "$GITHUB_PATH"

      # MkDocs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material

      # Build
      - name: Build docs
        run: |
          lua docs/extract.lua
          mkdocs build

      - name: Upload pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy_docs:
    if: ${{ github.event_name == 'push' }}
    needs: generate_docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
